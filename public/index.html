<!-- public/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias do Dia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CAMADA 1: O JORNAL (Visível por padrão) -->
    <div id="telaJornal" class="camada-ativa">
        <header class="jornal-header">
            <h1>O Observador</h1>
            <p>Portal de Notícias e Atualizações</p>
            
            <div class="busca-container">
                <input type="text" id="campoBusca" placeholder="Buscar no acervo...">
                <button onclick="verificarBuscaOuGatilho()" class="btn-busca">🔍</button>
            </div>
        </header>
        
        <main id="gradeNoticias" class="noticias-grid">
            <p>A conectar à rede de notícias...</p>
        </main>
    </div>

    <!-- CAMADA 2: O CHAT (Oculto por padrão) -->
    <div id="telaChat" class="camada-oculta">
        <header class="chat-header">
            <h2>O Observador - Sala Segura</h2>
            <span id="statusConexao" class="status-offline">Desconectado</span>
        </header>
        
        <main id="areaMensagens" class="area-mensagens">
        </main>

        <footer class="chat-input-area">
            <input type="file" id="arquivoInput" style="display: none;" accept="image/*, .pdf, .doc">
            <button class="btn-anexo" onclick="document.getElementById('arquivoInput').click()">📎</button>
            
            <input type="text" id="mensagemInput" placeholder="Escreva a sua mensagem...">
            <button class="btn-enviar" onclick="enviarMensagemTexto()">➤</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
