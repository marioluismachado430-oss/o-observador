<!-- public/index.html - Estrutura principal da página -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Observador</title>
    <!-- Liga esta estrutura ao arquivo de design CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE SEGURANÇA (O bloqueio que exige senha) -->
    <div id="telaBloqueio" class="bloqueio-container">
        <div class="bloqueio-caixa">
            <h2>Acesso Restrito - O Observador</h2>
            <p>Insira a senha de comunicação.</p>
            <input type="password" id="senhaInput" placeholder="Digite a senha...">
            <button onclick="desbloquear()">Acessar</button>
            <p id="mensagemErro" class="erro"></p>
        </div>
    </div>

    <!-- ÁREA PRINCIPAL (Onde aparecem as informações, oculta no início) -->
    <div id="conteudoPrincipal" class="conteudo-oculto">
        <header>
            <h1>O Observador</h1>
            <p>Painel de Comunicação e Notícias</p>
        </header>
        
        <!-- Grade onde as notícias da internet serão desenhadas -->
        <main id="gradeNoticias" class="noticias-grid">
            <p>A conectar à rede de notícias...</p>
        </main>
    </div>

    <!-- Liga a página ao arquivo de inteligência JavaScript -->
    <script src="script.js"></script>
</body>
</html>
