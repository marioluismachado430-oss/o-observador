<!-- public/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Observador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA 1: O JORNAL -->
    <div id="telaJornal" style="display: flex; flex-direction: column; height: 100vh;">
        <header style="background: #2c3e50; color: white; text-align: center; padding: 20px;">
            <h1>O Observador</h1>
            <p>Portal de Notícias</p>
        </header>

        <div style="padding: 15px; text-align: center; background: #e9ecef;">
            <input type="text" id="campoBusca" placeholder="Digite a senha..." style="padding: 10px; width: 200px; font-size: 16px;">
            <button onclick="verificarSenha()" style="padding: 10px 15px; background: #2c3e50; color: white; border: none; cursor: pointer;">Acessar</button>
        </div>

        <main style="padding: 20px; flex: 1; overflow-y: auto;">
            <h2>Notícias Recentes</h2>
            <p>Carregando atualizações do sistema...</p>
        </main>
    </div>

    <!-- TELA 2: O CHAT (Inicia oculto) -->
    <div id="telaChat" style="display: none; height: 100vh; flex-direction: column; background: #e5ddd5;">
        <header style="background: #075e54; color: white; padding: 15px; text-align: center;">
            <h2>Sala Segura - O Observador</h2>
        </header>
        <main style="flex: 1; padding: 20px; overflow-y: auto;" id="areaMensagens">
            <p>Conectado à sala de comunicação.</p>
        </main>
        <footer style="padding: 10px; background: #f0f0f0; display: flex; gap: 10px;">
            <input type="text" id="mensagemInput" placeholder="Escreva uma mensagem..." style="flex: 1; padding: 10px;">
            <button onclick="enviarMensagem()" style="padding: 10px 20px; background: #075e54; color: white; border: none;">Enviar</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
