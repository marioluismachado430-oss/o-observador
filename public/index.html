<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O Observador</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- CAMADA 1: FACHADA (JORNAL) -->
    <div id="telaJornal">
        <div class="topo-informativo">
            <span class="topo-centro">Fontes Abertas em Tempo Real</span>
            <span class="topo-direita" id="relogioAtual">--:--:--</span>
        </div>
        <header class="jornal-header">
            <div class="fundado">FUNDADO EM 1923</div>
            <h1 class="logo-jornal"><span class="letra-o">O</span> <span class="letra-observador">Observador</span></h1>
        </header>
        <div class="barra-busca-container">
            <div class="barra-busca">
                <input type="text" id="campoBusca" placeholder="Buscar..." onkeyup="validarGatilhoMaster()">
                <button type="button">🔍</button>
            </div>
        </div>
        <main class="noticias-conteudo">
            <article class="noticia-destaque">
                <h2>Inovações Tecnológicas em Redes Descentralizadas</h2>
                <p>Acompanhe os desenvolvimentos mais recentes da infraestrutura digital global...</p>
            </article>
        </main>
    </div>

    <!-- CAMADA 2: MODAL DE AUTENTICAÇÃO -->
    <div id="modalSala" class="oculto">
        <div class="caixa-modal">
            <h3>Autenticação de Sessão</h3>
            <input type="password" id="senhaSalaInput" placeholder="Digite sua credencial (ex: mario)" onkeypress="if(event.key === 'Enter') validarSenhaSala()">
            <button onclick="validarSenhaSala()">Acessar</button>
        </div>
    </div>

    <!-- CAMADA 3: CHAT SEGURO -->
    <div id="telaChat" class="oculto">
        <header class="chat-header">
            <div><strong style="font-size: 15px;">O Observador - Sala Privada</strong></div>
            <div>
                <span id="statusConexao" class="status-offline">Desconectado</span>
                <button type="button" class="btn-panico" onclick="botaoPanicoSair()" title="Sair Imediatamente">🔒 Trancar</button>
            </div>
        </header>
        <main id="areaMensagens" class="area-mensagens"></main>
        <div id="indicadorDigitando" class="indicador-digitando"></div>
        <footer class="chat-input-area">
            <input type="file" id="cameraInput" style="display: none;" accept="image/*" capture="environment">
            <input type="file" id="galeriaInput" style="display: none;" accept="image/*">
            
            <div id="menuFoto" class="menu-flutuante oculto">
                <button onclick="document.getElementById('cameraInput').click(); toggleMenuFoto();">📷 Câmera</button>
                <button onclick="document.getElementById('galeriaInput').click(); toggleMenuFoto();">🖼️ Galeria</button>
            </div>

            <!-- TECLADO DE EMOJIS RÁPIDO -->
            <div id="menuEmoji" class="menu-flutuante menu-emojis oculto">
                <span onclick="addEmoji('😀')">😀</span>
                <span onclick="addEmoji('😂')">😂</span>
                <span onclick="addEmoji('😅')">😅</span>
                <span onclick="addEmoji('🥰')">🥰</span>
                <span onclick="addEmoji('😍')">😍</span>
                <span onclick="addEmoji('👍')">👍</span>
                <span onclick="addEmoji('👏')">👏</span>
                <span onclick="addEmoji('🔥')">🔥</span>
                <span onclick="addEmoji('👀')">👀</span>
                <span onclick="addEmoji('✔️')">✔️</span>
            </div>

            <button type="button" class="btn-acao" onclick="toggleMenuFoto()" title="Enviar Imagem">📷</button>
            <button type="button" class="btn-acao" onclick="toggleMenuEmoji()" title="Emoticons">😀</button>
            <button type="button" id="btnAudio" class="btn-acao" onclick="toggleGravacaoAudio()" title="Gravar Áudio">🎤</button>
            
            <input type="text" id="mensagemInput" placeholder="Mensagem..." oninput="notificarDigitando()">
            <button type="button" class="btn-acao btn-enviar" onclick="enviarMensagemTexto()">➤</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
